<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DKR GROUP — Конструктор КП</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
--blue:#0b4a8f;--blue-dark:#0a2f5c;--acc:#2b93ec;--acc2:#4aa8f5;--acc3:#7dbcf5;
--tint1:#eaf2fb;--tint2:#f5f9fd;--tint3:#f7fbff;--tint4:#fafcfe;--app:#eef2f7;
--ink:#0a1f33;--ink2:#3d4c5c;--ink3:#5c6b7c;--mut:#7a8896;--mut2:#8a97a5;--mut3:#9aa7b5;--mut4:#a6b2c0;--mut5:#c3cfdb;
--b1:#e2e9f1;--b2:#dde5ee;--b3:#eef2f7;--b4:#f2f5f9;--b5:#cddff2;--b6:#cfe0f2;
--ok:#2b7a3f;--ok-bg:#eef7ee;--ok-b:#d3e8d6;--warn:#b5751a;--warn-bg:#fdf3e6;--err:#c96a6a;
--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
--sh-rail:0 6px 16px rgba(10,31,51,.05);--sh-card:0 10px 26px rgba(11,74,143,.09);--sh-pg:0 8px 20px rgba(10,31,51,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:14px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--mut4);opacity:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.hidden{display:none!important}

/* ---------- lock ---------- */
#lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--blue-dark);padding:20px}
.lock-box{background:#fff;border-radius:16px;padding:34px 30px;max-width:352px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(10,31,51,.28)}
.lock-box img{width:48px;height:48px;border-radius:50%;display:block;margin:0 auto 14px}
.lock-box .t{font-weight:800;font-size:19px;color:var(--blue);letter-spacing:.2px}
.lock-box .s{color:var(--mut);font-size:13px;margin:4px 0 20px}
.lock-box input{width:100%;padding:12px 14px;border:1px solid var(--b2);border-radius:10px;font-size:15px;margin-bottom:10px;background:#fff}
.lock-box input:focus{outline:none;border-color:var(--b5);box-shadow:0 0 0 3px rgba(11,74,143,.1)}
.lock-box button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:700}
#lockError{color:var(--err);font-size:12px;margin-top:10px;display:none}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;min-height:0}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex:none}
.tb-l{display:flex;align-items:center;gap:12px;min-width:0}
.tb-l img{width:32px;height:32px;border-radius:50%;display:block;flex:none}
.tb-title{font-weight:700;font-size:14px;letter-spacing:.2px}
.tb-sub{font-size:11px;color:var(--mut)}
.tb-r{display:flex;align-items:center;gap:10px;min-width:0}
.tb-chip{font-size:13px;color:var(--ink3);background:#f2f6fa;border:1px solid var(--b1);border-radius:9px;padding:7px 11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ava{width:32px;height:32px;border-radius:50%;background:var(--tint1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}

/* ---------- rail ---------- */
.rail{background:#fff;border-bottom:1px solid var(--b1);padding:11px 22px 12px;flex:none;box-shadow:var(--sh-rail);position:sticky;top:0;z-index:5}
.rail-track{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.rail-track::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:7px;border-radius:8px;padding:7px 11px;font-size:12.5px;flex:none;border:1px solid var(--b1);color:var(--mut);background:transparent;transition:background .14s ease,color .14s ease,border-color .14s ease}
.chip .n{color:var(--mut4);font-variant-numeric:tabular-nums}
.chip:hover{border-color:#9db3c8}
.chip.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-b);font-weight:600}
.chip.done .n{color:var(--ok)}
.chip.cur{background:var(--blue);color:#fff;border-color:var(--blue);padding:7px 12px;font-weight:650}
.chip.cur .n{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}

/* ---------- body ---------- */
.body{flex:1;min-height:0;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:20px;padding:20px 22px;overflow:hidden}
.col-main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow-y:auto;padding-right:2px}
.col-main::-webkit-scrollbar{width:8px}
.col-main::-webkit-scrollbar-thumb{background:var(--mut5);border-radius:8px}

/* collapsed / pending steps */
.step-done{background:#fff;border:1px solid var(--b1);border-radius:12px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none}
.step-done .ico{width:22px;height:22px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.step-done .lbl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut3);font-weight:700}
.step-done .sum{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-done .edit{font-size:13px;color:var(--blue);font-weight:650;flex:none;background:none;border:0;padding:0}
.step-next{background:#fff;border:1px dashed var(--b2);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;color:var(--mut);text-align:left;width:100%}
.step-next .n{width:22px;height:22px;border-radius:50%;background:#f2f6fa;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.step-next .nm{font-size:13.5px;font-weight:600;color:var(--ink2)}
.step-next .ds{font-size:12.5px}
.step-next .go{font-size:13px;color:var(--mut4);flex:none}

/* active step card */
.step-card{background:#fff;border:1px solid var(--b5);border-radius:14px;box-shadow:var(--sh-card);overflow:hidden;flex:none}
.step-head{padding:16px 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--b3)}
.step-kicker{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:4px}
.step-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.step-desc{font-size:13px;color:var(--ink3);margin-top:4px;max-width:560px;text-wrap:pretty}
.posts-badge{text-align:right;flex:none;background:#f2f6fa;border:1px solid var(--b1);border-radius:10px;padding:9px 13px}
.posts-badge .l{font-size:11px;color:var(--mut);letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.posts-badge .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--blue)}
.step-body{padding:16px 18px 18px}
.step-info{display:flex;align-items:center;gap:10px;background:var(--tint3);border-top:1px solid #e6eef7;padding:12px 18px;font-size:12.5px;color:var(--ink2)}
.step-info .i{width:18px;height:18px;border-radius:50%;background:#dce9f7;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}

/* fields */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--b2);border-radius:9px;background:#fff;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--b5);box-shadow:0 0 0 3px rgba(11,74,143,.09)}
.field textarea{min-height:74px;line-height:1.6;resize:vertical}
.hint{font-size:12px;color:var(--mut);margin-top:6px}

/* choice cards */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cardsel{border:1px solid var(--b2);border-radius:12px;padding:15px;background:#fff;position:relative;cursor:pointer;text-align:left;width:100%;transition:border-color .14s ease,background .14s ease}
.cardsel:hover{border-color:#9db3c8}
.cardsel.on{border:2px solid var(--blue);padding:14px;background:linear-gradient(180deg,var(--tint3),#fff)}
.cardsel .tick{display:none;position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cardsel.on .tick{display:flex}
.ph{height:132px;border-radius:9px;background:repeating-linear-gradient(135deg,#f3f6f9 0 10px,#edf1f5 10px 20px);display:flex;align-items:center;justify-content:center;color:#a9b6c3;font-size:12px;margin-bottom:12px}
.cardsel.on .ph{background:repeating-linear-gradient(135deg,#eef4fa 0 10px,#e7eef6 10px 20px);color:#9db3c8}
img.ph{object-fit:contain;background:var(--tint2);padding:6px}
.cardsel .nm{font-size:16px;font-weight:750}
.cardsel .ds{font-size:12.5px;color:var(--ink3);margin-top:3px;text-wrap:pretty}
.baselist{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:12.5px;color:var(--ink3)}
.cardsel.on .baselist{color:var(--ink2)}
.baselist div{display:flex;gap:7px}
.baselist .b{color:#a9b6c3;flex:none}
.cardsel.on .baselist .b{color:var(--blue)}
.baselist .m{color:var(--err);flex:none}
.cardfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #edf1f5}
.cardsel.on .cardfoot{border-top-color:var(--b1)}
.cardfoot .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.cardfoot .v{font-family:var(--mono);font-size:17px;font-weight:700}
.cardfoot .r{text-align:right}
.cardfoot .r .v{color:var(--ink3)}
.cardsel.on .cardfoot .r .v{color:var(--blue)}

/* bum grid */
.filters{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.filt{border:1px solid var(--b2);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--ink2);background:#fff;transition:background .14s ease,border-color .14s ease,color .14s ease}
.filt.on{background:var(--tint1);border-color:var(--b5);color:var(--blue);font-weight:650}
.bumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start}
.bumcard{border:1px solid var(--b2);border-radius:12px;padding:12px;background:#fff;position:relative;cursor:pointer;text-align:left;transition:border-color .14s ease,background .14s ease}
.bumcard:hover{border-color:#9db3c8}
.bumcard.on{border:2px solid var(--blue);padding:11px;background:linear-gradient(180deg,var(--tint3),#fff)}
.bumcard .tick{display:none;position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.bumcard.on .tick{display:flex}
.bumcard .ph{height:104px;border-radius:8px;font-size:11px;margin-bottom:9px}
.bumcard .nm{font-size:13.5px;font-weight:700}
.bumcard .ds{font-size:11.5px;color:var(--mut);margin-top:2px}
.bumcard .ft{margin-top:9px;padding-top:9px;border-top:1px solid #edf1f5}
.bumcard.on .ft{border-top-color:var(--b1)}
.bumcard .up{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2)}
.bumcard.on .up{color:var(--ink)}
.bumcard .inbase{font-size:12.5px;font-weight:700;color:var(--ok)}
.bumcard .bnote{font-size:11px;color:var(--mut);margin-top:2px}

/* tiles (functions, payments, extras) */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{border:1px solid var(--b2);border-radius:11px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;width:100%;transition:border-color .14s ease,background .14s ease}
.tile:hover{border-color:#9db3c8}
.tile.on{border:2px solid var(--blue);padding:11px 12px;background:var(--tint3)}
.tile .nm{font-size:13.5px;font-weight:700}
.tile .ds{font-size:11.5px;color:var(--mut);margin-top:2px;text-wrap:pretty}
.tile .pr{font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:7px;color:var(--ink2)}
.tile.on .pr{color:var(--ink)}
.tile .prt{font-size:12.5px;color:var(--mut);margin-top:7px}
.tile.on .prt{color:var(--blue);font-weight:650}
.box{width:20px;height:20px;border-radius:6px;border:1px solid #cfd8e2;flex:none;background:#fff}
.tile.on .box{border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tile.on .box::after{content:"✓"}

/* sub-config block */
.sub{border:1px solid var(--b5);border-radius:11px;background:var(--tint3);padding:13px 14px;margin-top:12px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sub-head .t{font-size:13.5px;font-weight:700}
.sub-head .s{font-size:12px;color:var(--mut)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid #cfd8e2;border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:background .14s ease,color .14s ease,border-color .14s ease}
.pill:hover{border-color:#9db3c8}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}
.pill.on span{opacity:.7}
.radios{display:flex;flex-direction:column;gap:8px}
.radioline{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--b2);border-radius:9px;padding:10px 12px;font-size:13px;cursor:pointer}
.radioline.on{border-color:var(--blue);background:var(--tint3)}

/* per-post table */
.panel{border:1px solid var(--b1);border-radius:11px;overflow:hidden;margin-top:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;background:var(--tint4);border-bottom:1px solid var(--b3)}
.panel-head .t{font-size:13.5px;font-weight:700}
.switch{width:42px;height:22px;border-radius:22px;background:#cfd8e2;position:relative;flex:none;border:0;padding:0;transition:background .14s ease}
.switch .k{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .14s ease}
.switch.on{background:var(--blue)}
.switch.on .k{left:23px}
.ptab{overflow-x:auto}
.prow{display:grid;font-size:12.5px;align-items:center;border-bottom:1px solid var(--b4);min-width:520px}
.prow:last-child{border-bottom:0}
.prow.h{font-size:12px;color:var(--mut);background:#fff;border-bottom:1px solid var(--b3)}
.prow.alt{background:var(--tint4)}
.prow>div{padding:9px}
.prow>div:first-child{padding-left:14px;font-weight:650}
.prow.h>div{padding:8px}
.prow.h>div:first-child{padding:8px 14px;font-weight:400}
.pcell{cursor:pointer;color:var(--mut5);user-select:none}
.pcell.on{color:var(--blue);font-weight:700}

/* action bar */
.actions{background:#fff;border:1px solid var(--b1);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -6px 18px rgba(10,31,51,.05);flex:none;margin-top:auto}
.btn{border:1px solid var(--b2);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:650;color:var(--ink2);background:#fff;transition:border-color .14s ease,background .14s ease}
.btn:hover{border-color:#9db3c8}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--b2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;padding:10px 18px;font-weight:700}
.btn.primary:hover{background:#0d569f;border-color:#0d569f}
.kbd{font-size:12.5px;color:var(--mut)}

/* ---------- side panel ---------- */
.side{background:#fff;border:1px solid var(--b1);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-head{padding:15px 16px 12px;border-bottom:1px solid var(--b3);display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.side-head .t{font-size:15px;font-weight:700}
.side-head .c{font-size:12px;color:var(--mut)}
.side-list{flex:1;min-height:0;overflow-y:auto;padding:6px 16px}
.side-list::-webkit-scrollbar{width:8px}
.side-list::-webkit-scrollbar-thumb{background:var(--mut5);border-radius:8px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--b4);font-size:13px;transition:background .16s ease}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600}
.li .sb{color:var(--mut);font-size:12px}
.li .am{font-family:var(--mono);font-weight:700;white-space:nowrap}
.li.flash{background:var(--tint3);margin:0 -16px;padding-left:16px;padding-right:16px}
.li.flash .sb{color:var(--blue)}
.li.note{font-size:12.5px;color:var(--mut)}
.li.note .am{font-family:inherit;font-weight:400}
.side-empty{padding:14px 0;font-size:12.5px;color:var(--mut)}
.side-tot{padding:14px 16px;background:var(--tint3);border-top:1px solid #e6eef7;flex:none}
.side-tot .r{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink3);margin-bottom:5px}
.side-tot .r.m{color:var(--mut)}
.side-tot .r div:last-child{font-family:var(--mono)}
.side-tot .r.m div:last-child{font-family:inherit}
.side-tot .grand{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #dbe7f4}
.side-tot .grand .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
.side-tot .grand .v{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--blue);white-space:nowrap}
.side-act{padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--b3);flex:none}
.side-act .make{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;text-align:center;font-weight:700;font-size:14px;width:100%}
.side-act .make:hover{background:#0d569f}
.side-act .exp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.side-act .exp button{border:1px solid var(--b2);border-radius:9px;padding:9px;text-align:center;font-size:12.5px;font-weight:650;color:var(--ink2);background:#fff}
.side-act .exp button:hover{border-color:#9db3c8}
.side-act .link{border:1px solid var(--b5);border-radius:9px;padding:9px;text-align:center;font-size:12.5px;font-weight:650;color:var(--blue);background:#fff}
.side-act .clr{text-align:center;font-size:12px;color:var(--mut4);background:none;border:0;padding:2px}
.side-act .clr:hover{color:var(--ink3)}

/* checklist (step 12) */
.check{display:flex;gap:9px;align-items:center;font-size:13px;padding:2px 0}
.check .m{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;background:var(--ok-bg);color:var(--ok)}
.check.warn{color:var(--mut)}
.check.warn .m{background:var(--warn-bg);color:var(--warn)}
.counts{border-top:1px solid var(--b4);margin-top:6px;padding-top:12px;display:flex;flex-direction:column;gap:5px}
.counts div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3)}
.counts b{font-family:var(--mono);color:var(--ink)}

/* preview shell (step 12) */
.pv-card{background:#fff;border:1px solid var(--b1);border-radius:14px;flex:1;min-height:420px;overflow:hidden;display:flex;flex-direction:column}
.pv-head{padding:13px 18px;border-bottom:1px solid var(--b3);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.pv-head .t{font-size:15px;font-weight:700}
.pv-tabs{display:flex;gap:8px}
.pv-tabs button{border:1px solid var(--b2);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--mut);background:#fff}
.pv-tabs button.on{color:var(--ink2);border-color:var(--b5);background:var(--tint1)}
.pv-scroll{flex:1;min-height:0;overflow:auto;padding:16px 18px;background:#f4f7fb;display:flex;justify-content:center}
.pv-zoom{width:794px;transform-origin:top center}

/* ---------- КП документ (направление 1b «Инженерный») ---------- */
.doc{width:794px;min-height:1123px;background:#fff;padding:46px 54px 40px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,31,51,.15);font-size:13.5px;color:var(--ink)}
.doc+.doc{margin-top:22px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:26px;border-bottom:3px solid var(--blue);padding-bottom:16px}
.doc-kicker{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--blue);font-weight:700}
.doc-h1{font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.14;margin-top:8px;text-wrap:balance}
.doc-brand{text-align:right;flex:none}
.doc-brand img{width:38px;height:38px;border-radius:50%;display:block;margin-left:auto}
.doc-brand .n{font-size:15px;font-weight:800;margin-top:7px}
.doc-brand .s{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut2);margin-top:2px}
.doc-brand .no{font-family:var(--mono);font-size:11px;color:var(--mut2);margin-top:9px}
.doc-req{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--b1);border:1px solid var(--b1);margin-top:22px}
.doc-req>div{background:#fff;padding:11px 13px;min-width:0}
.doc-req .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2);font-weight:700}
.doc-req .v{font-size:13.5px;font-weight:650;margin-top:3px;word-wrap:break-word}
.doc-sec{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:26px 0 10px}
.doc-p{font-size:13.5px;line-height:1.62;color:var(--ink2);text-wrap:pretty}
.doc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.doc-stats>div{background:var(--tint2);border-left:2px solid var(--blue);padding:10px 12px}
.doc-stats .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--blue)}
.doc-stats .l{font-size:10.5px;color:var(--mut2);margin-top:3px;line-height:1.35}
.spec{margin-top:10px;border:1px solid var(--b1);border-top:0}
.spec-h,.spec-r{display:grid;grid-template-columns:1fr 62px 108px 122px}
.spec-h{background:var(--tint1);border-bottom:2px solid var(--b6);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);font-weight:700}
.spec-h>div{padding:8px 10px}
.spec-r{font-size:12.5px;border-bottom:1px solid var(--b4);align-items:start}
.spec-r:last-child{border-bottom:0}
.spec-r.alt{background:var(--tint4)}
.spec-r>div{padding:9px 10px}
.spec-nm{display:flex;gap:9px;min-width:0}
.spec-nm img{width:44px;height:44px;object-fit:contain;background:var(--tint2);border:1px solid var(--b1);border-radius:6px;flex:none}
.spec-nm .n{font-weight:650}
.spec-nm .d{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4;text-wrap:pretty}
.spec-q,.spec-p,.spec-s{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.spec-q{text-align:center}
.spec-s{font-weight:700}
.spec-h .spec-q,.spec-h .spec-p,.spec-h .spec-s{font-family:inherit}
.doc-cols{display:grid;grid-template-columns:1fr 300px;gap:26px;margin-top:26px;align-items:start}
.term{display:flex;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--b4)}
.term:last-child{border-bottom:0}
.term .t{font-family:var(--mono);color:var(--blue);font-weight:700;width:112px;flex:none}
.mgr{border:1px solid var(--b1);padding:16px}
.mgr .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut2);font-weight:700}
.mgr .n{font-size:15px;font-weight:700;margin-top:6px}
.mgr .c{font-family:var(--mono);font-size:13px;color:var(--blue);margin-top:8px;line-height:1.7}
.doc-tot{border:1px solid var(--b6);margin-top:26px}
.doc-tot .r{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;font-size:13.5px;border-bottom:1px solid var(--b4)}
.doc-tot .r div:last-child{font-family:var(--mono);font-weight:650}
.doc-tot .grand{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--blue);color:#fff;padding:17px 18px}
.doc-tot .grand .l{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#bcd6f0;font-weight:700}
.doc-tot .grand .v{font-family:var(--mono);font-size:26px;font-weight:700}
.doc-notes{margin-top:22px;font-size:13px;line-height:1.62;color:var(--ink2);white-space:pre-wrap;text-wrap:pretty}
.doc-foot{margin-top:auto;padding-top:16px;border-top:1px solid #edf1f5;display:flex;justify-content:space-between;gap:16px;font-size:10.5px;color:var(--mut3)}

/* ---------- mobile ---------- */
.m-only{display:none}
.msheet-bg{display:none;position:fixed;inset:0;background:rgba(10,31,51,.4);z-index:20}
.msheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;max-height:76vh;display:flex;flex-direction:column;z-index:21}
.msheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--b3);display:flex;justify-content:space-between;align-items:center}
.msheet-h .t{font-size:15px;font-weight:700}
.msheet-h button{border:0;background:none;font-size:20px;color:var(--mut);line-height:1;padding:0 4px}

@media (max-width:1199px){
  .body{grid-template-columns:minmax(0,1fr);overflow:auto;padding:16px}
  .col-main{overflow:visible}
  .side{min-height:0}
  .bumgrid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:899px){
  body{height:auto}
  #app{height:auto;min-height:100vh}
  .rail{padding:10px 16px 11px}
  .topbar{padding:0 16px;height:56px;gap:10px}
  .tb-sub{display:none}
  .tb-chip{max-width:none;flex:1;min-width:0}
  .tb-r{flex:1;justify-content:flex-end}
  .body{padding:14px 16px calc(var(--mbar-h, 132px) + 12px);gap:14px}
  .actions{position:static;flex-wrap:wrap;gap:10px}
  .side{display:none}
  .m-only{display:block}
  .step-head{flex-wrap:wrap;gap:12px}
  .cards2,.tiles,.tiles.c2,.grid2{grid-template-columns:1fr 1fr}
  .bumgrid{grid-template-columns:repeat(2,1fr)}
  .doc{width:100%;min-height:0;padding:24px 20px}
  .doc-req,.doc-stats{grid-template-columns:1fr 1fr}
  .doc-cols{grid-template-columns:1fr}
  .doc-h1{font-size:26px}
}
@media (max-width:599px){
  .cards2,.tiles,.tiles.c2,.grid2,.bumgrid,.side-act .exp{grid-template-columns:1fr}
  .spec-h,.spec-r{grid-template-columns:1fr 40px 74px 84px}
  .spec-h>div,.spec-r>div{padding:8px 6px}
  .spec-nm img{width:36px;height:36px}
  .doc-h1{font-size:22px}
}

/* mobile bottom bar */
.mbar{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b1);padding:10px 16px calc(14px + env(safe-area-inset-bottom));z-index:15}
@media (max-width:899px){.mbar{display:block}}
.mbar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px;width:100%;background:none;border:0;padding:0}
.mbar-top .l{font-size:12px;color:var(--mut)}
.mbar-top .v{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--blue)}
.mbar-row{display:flex;gap:9px}
.mbar-row .back{border:1px solid var(--b2);border-radius:11px;padding:13px 16px;font-size:14px;font-weight:650;color:var(--ink2);background:#fff;flex:none;min-height:44px}
.mbar-row .next{flex:1;background:var(--blue);color:#fff;border:0;border-radius:11px;padding:13px;text-align:center;font-size:14.5px;font-weight:700;min-height:44px}
.mbar-row .next:disabled{opacity:.5}
.mprog{height:4px;border-radius:4px;background:#e6eef7;overflow:hidden;margin-top:9px}
.mprog>div{height:100%;background:var(--blue);transition:width .16s ease}

@media print{
  body{background:#fff}
  .topbar,.rail,.side,.actions,.mbar,.pv-head{display:none!important}
  .doc{box-shadow:none;width:auto;padding:0}
}

let __downloadsCap=null;
(async()=>{try{if(window.claude&&window.claude.use){__downloadsCap=await window.claude.use("downloads")}}catch(e){}})();
async function __offerFile(filename,blob){
  if(__downloadsCap){
    try{await __downloadsCap.save({filename,data:blob});return true}
    catch(e){console.warn("download failed",e);return false}
  }
  try{
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;a.rel="noopener";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    return true;
  }catch(e){return false}
}

/* ==========================================================================
   Заполненность и сводки шагов
   ========================================================================== */
/* Шаги 1–5 обязательны: отмечаются, только когда реально заполнены.
   Остальные могут быть законно пустыми — отмечаются по факту посещения. */
const REQUIRED=[1,2,3,4,5];
function stepDone(n){
  if(!REQUIRED.includes(n)&&visited.has(n)&&n!==currentStep)return true;
  return stepFilled(n);
}
function stepFilled(n){
  switch(n){
    case 1:return !!(project.trim()||client.trim());
    case 2:return !!pkg;
    case 3:return !!bum;
    case 4:return payments.size>0;
    case 5:return selectedFuncs.size>0;
    case 6:return Object.values(accQty).some(v=>v!=null);
    case 7:return (osmosSysOn&&!!osmosSysId)||(softenerOn&&softenerPrice>0);
    case 8:return selectedExtra.size>0||dryMistOn||cloudCashOn||
      Object.values(manualQty).some(v=>+v>0);
    case 9:return vacOn&&!!vacModelId;
    case 10:return vacSt1On||(vacSt2On&&!!vacSt2ModelId);
    case 11:return montageOn;
    case 12:return !!notes.trim();
  }
  return false;
}
function stepSummary(n){
  const p=P();
  switch(n){
    case 1:{
      const bits=[project,client,contact].filter(x=>x&&x.trim());
      bits.push(`${p} пост.`);
      return bits.join(" · ");
    }
    case 2:return pkg?`${pkg.name} · ${money(pkg.price)} / пост · ${p} пост.`:"Не выбрана";
    case 3:{
      if(!bum)return "Не выбран";
      const d=bum.price-bumBasePrice;
      return `${bum.name} · ${d>0?"доплата "+money(d)+" / пост":"входит в базу"}`;
    }
    case 4:return payments.size?pays.filter(x=>payments.has(x[0])).map(x=>x[1]).join(", "):"Не выбраны";
    case 5:{
      if(!selectedFuncs.size)return "Не выбраны";
      const names=[...selectedFuncs].map(id=>funcs.find(f=>f.id===id)?.name).filter(Boolean);
      return `${names.length} функц. · ${names.join(", ")}`;
    }
    case 6:return `Консоли ${accValue("consoles")} · коврики ${accValue("holders")} · держатели ${accValue("gunholders")} · пенный ${accValue("foamguns")} · вода ${accValue("waterguns")}`;
    case 7:{
      const b=[];
      if(osmosSysOn&&osmosSysId)b.push(osmosSystems.find(o=>o.id===osmosSysId)?.name);
      if(softenerOn)b.push("Умягчение"+(softenerPrice?" · "+money(softenerPrice):" · цена не задана"));
      return b.length?b.filter(Boolean).join(" · "):"Не требуется";
    }
    case 8:{
      const b=[];
      extraEquip.forEach(f=>{if(selectedExtra.has(f.id))b.push(`${f.name} ×${extraQty[f.id]??p}`)});
      [["qtySink","Рукомойник"],["qtyTable12","Стол 1,2 м"],["qtyTable20","Стол 2 м"],["qtyTank","Ёмкость"]]
        .forEach(([id,nm])=>{if(+manualQty[id]>0)b.push(`${nm} ×${manualQty[id]}`)});
      if(dryMistOn)b.push("Сухой туман");
      if(cloudCashOn)b.push("Облачная касса");
      return b.length?b.join(" · "):"Не требуется";
    }
    case 9:{
      if(!vacOn)return "Не требуется";
      const m=vacModels.find(x=>x.id===vacModelId);
      return `${vacQty??p} шт · ${m?m.name:"модель не выбрана"}`;
    }
    case 10:{
      const b=[];
      if(vacSt1On)b.push(`1-постовой ×${vacSt1Qty}`);
      if(vacSt2On){const m=vacSt2Models.find(x=>x.id===vacSt2ModelId);b.push(`2-постовой ×${vacSt2Qty}${m?" · "+m.name:" · модель не выбрана"}`)}
      return b.length?b.join(" · "):"Не требуется";
    }
    case 11:return montageOn?`Включён · 10% = ${money(buildItems().montage)}`:"Не включён";
    case 12:return notes.trim()?notes.trim().slice(0,120):"Условия не заданы";
  }
  return "";
}

/* ==========================================================================

function renderRail(){
  const rail=E("rail");
  rail.innerHTML=STEPS.map(s=>{
    const done=stepDone(s.n)&&s.n!==currentStep;
    const cls=s.n===currentStep?"chip cur":done?"chip done":"chip";
    const mark=s.n===currentStep?s.n:done?"✓":s.n;
    return `<button class="${cls}" data-step="${s.n}"><span class="n">${mark}</span>${esc(s.short)}</button>`;
  }).join("");
  rail.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>goStep(+b.dataset.step));
  const cur=rail.querySelector(".chip.cur");
  if(cur){
    const left=cur.offsetLeft,right=left+cur.offsetWidth;
    if(left<rail.scrollLeft+8)rail.scrollLeft=Math.max(0,left-8);
    else if(right>rail.scrollLeft+rail.clientWidth-8)rail.scrollLeft=right-rail.clientWidth+8;
  }
}

function bindSideActions(){
  E("btnMake").onclick=()=>{if(currentStep!==LAST)goStep(LAST);else renderMain()};
  E("btnPdf").onclick=exportPdf;
  E("btnWord").onclick=exportWord;
  E("btnExcel").onclick=exportExcel;
  E("btnClear").onclick=clearDraft;
  if(E("btnLink"))E("btnLink").onclick=copyLink;
}

/* подсветка изменённых строк */
function flash(...ids){
  ids.forEach(id=>lastChangedIds.add(id));
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{lastChangedIds.clear();renderSide()},2200);
}

/* ==========================================================================
   Навигация
   ========================================================================== */
function goStep(n){
  currentStep=Math.min(LAST,Math.max(1,n));
  visited.add(currentStep);
  renderAll();
  E("main").scrollTop=0;
  saveDraft();
}
function renderAll(){
  renderRail();
  renderMain();
  renderSide();
  renderTopbar();
  renderMbar();
}
function renderTopbar(){
  E("tbProject").textContent=project.trim()||client.trim()||"Новый проект";
  const nm=(client.trim()||contact.trim()||"DKR").replace(/[«»"]/g,"").trim();
  E("tbAva").textContent=(nm.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("")||"DK").toUpperCase();
}
function renderMbar(){
  const s=STEPS[currentStep-1],next=STEPS[currentStep];
  E("mbarBack").disabled=currentStep===1;
  E("mbarNext").disabled=currentStep===LAST;
  E("mbarNext").textContent=next?`Далее: ${next.short}`:"Готово";
  E("mbarProg").style.width=Math.round(completedCount()/LAST*100)+"%";
  syncMbarPad();
}
function syncMbarPad(){
  const mbar=document.querySelector(".mbar");
  if(!mbar)return;
  requestAnimationFrame(()=>{
    document.documentElement.style.setProperty("--mbar-h",mbar.offsetHeight+"px");
  });
}
function completedCount(){return STEPS.filter(s=>stepDone(s.n)).length}
/* ==========================================================================
   Главная колонка
   ========================================================================== */
function renderMain(){
  const m=E("main");
  let h="";
  for(const s of STEPS){
    if(s.n>=currentStep)break;
    if(stepDone(s.n))h+=`<div class="step-done">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <span class="ico">✓</span>
        <div style="min-width:0">
          <div class="lbl">Шаг ${s.n} · ${esc(s.short)}</div>
          <div class="sum">${esc(stepSummary(s.n))}</div>
        </div>
      </div>
      <button class="edit" data-edit="${s.n}">Изменить</button>
    </div>`;
  }
  const s=STEPS[currentStep-1];
  h+=`<section class="step-card">
    <div class="step-head">
      <div>
        <div class="step-kicker">Шаг ${s.n} из ${LAST}</div>
        <div class="step-title">${esc(s.title)}</div>
        <div class="step-desc">${esc(s.desc)}</div>
      </div>
      ${currentStep>1?`<div class="posts-badge"><div class="l">Постов</div><div class="v">${P()}</div></div>`:""}
    </div>
    <div class="step-body">${stepContent(currentStep)}</div>
    ${stepInfo(currentStep)}
  </section>`;

  for(const nx of STEPS.slice(currentStep,currentStep+2)){
    h+=`<button class="step-next" data-go="${nx.n}">
      <span style="display:flex;align-items:center;gap:12px;min-width:0">
        <span class="n">${nx.n}</span>
        <span class="nm">${esc(nx.title)}</span>
        <span class="ds">${esc(nextHint(nx.n))}</span>
      </span>
      <span class="go">Далее</span>
    </button>`;
  }

  const nxt=STEPS[currentStep];
  h+=`<div class="actions">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn" id="btnBack" ${currentStep===1?"disabled":""}>← Назад</button>
      <div class="kbd">Шаг ${currentStep} из ${LAST} · заполнено ${completedCount()}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="kbd">⌘↵ — быстрый переход</div>
      ${nxt?`<button class="btn primary" id="btnNext">Далее: ${esc(nxt.short)} →</button>`
           :`<button class="btn primary" id="btnMake2">Сформировать КП</button>`}
    </div>
  </div>`;

  m.innerHTML=h;
  m.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>goStep(+b.dataset.edit));
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>goStep(+b.dataset.go));
  if(E("btnBack"))E("btnBack").onclick=()=>goStep(currentStep-1);
  if(E("btnNext"))E("btnNext").onclick=()=>goStep(currentStep+1);
  if(E("btnMake2"))E("btnMake2").onclick=()=>{previewPage=1;renderMain()};
  bindStep(currentStep);
}
function nextHint(n){
  switch(n){
    case 2:return "Старт или Стандарт";
    case 3:return `${bums.length} моделей · БУМ №20 включён в базу`;
    case 4:return "купюры, монеты, карта, QR, лояльность";
    case 5:return `${funcs.length} функций мойки`;
    case 6:return "консоли, держатели, пистолеты";
    case 7:return "осмос и умягчение воды";
    case 8:return "светофор, клапаны, столы, касса";
    case 9:return "кнопка на БУМ + модель";
    case 10:return "станции на 1 и 2 поста";
    case 11:return "10% от стоимости оборудования";
    case 12:return "условия и предпросмотр";
  }
  return "";
}
function stepInfo(n){
  const t={
    2:"Разница между «Старт» и «Стандарт» — в силовой раме и клапанах НД. Для «Старт» доступен отдельный клапан НД перекрытия воды на шаге 8.",
    3:"БУМ №20 входит в базовую комплектацию поста. Для остальных моделей в КП попадает только доплата к базе.",
    4:"Все выбранные способы оплаты устанавливаются на каждый выбранный БУМ.",
    6:"По умолчанию: 2 консоли и 4 держателя ковриков на пост. Всё, что сверх нормы, считается доплатой.",
    7:"Это отдельные системы на объект. Функция «Осмос» на каждый пост включается на шаге 5.",
    11:"Командировочные расходы, суточные, проезд и расходные материалы приобретаются заказчиком отдельно."

  return t?`<div class="step-info"><span class="i">i</span>${esc(t)}</div>`:"";
}

      if(vacSt2On)h+=`<div class="sub">

function touch(){renderSide();renderRail();renderMbar();saveDraft()}
function refresh(){renderAll();saveDraft()}

function bindStep(n){
  const m=E("main");

  /* универсальные тумблеры-плитки */
  m.querySelectorAll("[data-tgl]").forEach(b=>b.onclick=()=>{
    switch(b.dataset.tgl){
      case "osmosSys":osmosSysOn=!osmosSysOn;if(!osmosSysOn)osmosSysId="";flash("osmossys");break;
      case "softener":softenerOn=!softenerOn;if(!softenerOn)softenerPrice=0;flash("softener");break;
      case "dryMist":dryMistOn=!dryMistOn;flash("drymist");break;
      case "cloudCash":cloudCashOn=!cloudCashOn;flash("cloudcash");break;
      case "vac":vacOn=!vacOn;if(!vacOn){vacQty=null;vacModelId=""}flash("vacfunc","vacmodel");break;
      case "vacSt1":vacSt1On=!vacSt1On;if(!vacSt1On){vacSt1Qty=1;vacSt1Addons.clear()}flash("vacst1");break;
      case "vacSt2":vacSt2On=!vacSt2On;if(!vacSt2On){vacSt2Qty=1;vacSt2ModelId="";vacSt2Addons.clear()}flash("vacst2");break;
      case "montage":montageOn=!montageOn;break;
    }
    refresh();
  });

  if(n===1){
    const bind=(id,setter)=>{const el=E(id);if(!el)return;
      el.oninput=()=>{setter(el.value);renderTopbar();touch()};};
    bind("fProject",v=>project=v);
    bind("fClient",v=>client=v);
    bind("fContact",v=>contact=v);
    const fp=E("fPosts");
    if(fp){
      fp.oninput=()=>{posts=Math.max(1,Math.min(60,+fp.value||1));touch()};
      fp.onchange=()=>{fp.value=P();refresh()};
    }
  }

  if(n===2)m.querySelectorAll("[data-pkg]").forEach(b=>b.onclick=()=>{
    pkg=packages.find(p=>p.id===b.dataset.pkg);flash("pkg");refresh();
  });

  if(n===3){
    m.querySelectorAll("[data-filt]").forEach(b=>b.onclick=()=>{bumFilter=b.dataset.filt;renderMain()});
    m.querySelectorAll("[data-bum]").forEach(b=>b.onclick=()=>{
      bum=bums.find(x=>x.id===b.dataset.bum);flash("bum");refresh();
    });
  }

  if(n===4)m.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.pay;
    payments.has(id)?payments.delete(id):payments.add(id);
    flash("pay_"+id);refresh();
  });

  if(n===5){
    m.querySelectorAll("[data-func]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.func;
      if(selectedFuncs.has(id)){selectedFuncs.delete(id);delete perPost[id]}
      else{selectedFuncs.add(id);perPost[id]=new Set(Array.from({length:P()},(_,i)=>i+1))}
      flash("f_"+id);refresh();
    });
    if(E("fChemType"))E("fChemType").onchange=()=>{chemType=E("fChemType").value;flash("f_chem");refresh()};
    m.querySelectorAll("[data-chem]").forEach(b=>b.onclick=()=>{
      const nm=b.dataset.chem;
      chemTypesSelected.has(nm)?chemTypesSelected.delete(nm):chemTypesSelected.add(nm);
      flash("f_chem");refresh();
    });
    m.querySelectorAll('input[name="winter"]').forEach(r=>r.onchange=()=>{winter=r.value;flash("f_winter");refresh()});
    if(E("fDegType"))E("fDegType").onchange=()=>{degreaserType=E("fDegType").value;flash("f_degreaser");refresh()};
    if(E("perPostSwitch"))E("perPostSwitch").onclick=()=>{
      perPostMode=!perPostMode;
      if(perPostMode)selectedFuncs.forEach(id=>{
        if(!perPost[id])perPost[id]=new Set(Array.from({length:P()},(_,i)=>i+1));
      });
      refresh();
    };
    m.querySelectorAll("[data-pp]").forEach(c=>c.onclick=()=>{
      const id=c.dataset.pp,post=+c.dataset.post;
      if(!perPost[id])perPost[id]=new Set();
      perPost[id].has(post)?perPost[id].delete(post):perPost[id].add(post);
      flash("f_"+id);refresh();
    });
  }

  if(n===6)m.querySelectorAll("[data-acc]").forEach(el=>{
    el.oninput=()=>{accQty[el.dataset.acc]=Math.max(0,+el.value||0);flash("acc_"+el.dataset.acc);touch()};
    el.onchange=()=>refresh();
  });

  if(n===7){
    if(E("fOsmos"))E("fOsmos").onchange=()=>{osmosSysId=E("fOsmos").value;flash("osmossys");refresh()};
    if(E("fSoftener")){
      const el=E("fSoftener");
      el.oninput=()=>{softenerPrice=Math.max(0,+el.value||0);flash("softener");touch()};
      el.onchange=()=>refresh();
    }
  }

  if(n===8){
    m.querySelectorAll("[data-extra]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.extra;
      if(selectedExtra.has(id)){selectedExtra.delete(id);delete extraQty[id]}else selectedExtra.add(id);
      flash("ex_"+id);refresh();
    });
    m.querySelectorAll("[data-exqty]").forEach(el=>{
      el.oninput=()=>{extraQty[el.dataset.exqty]=Math.max(0,+el.value||0);flash("ex_"+el.dataset.exqty);touch()};
      el.onchange=()=>refresh();
    });
    m.querySelectorAll("[data-mq]").forEach(el=>{
      el.oninput=()=>{manualQty[el.dataset.mq]=Math.max(0,+el.value||0);flash("mq_"+el.dataset.mq);touch()};
      el.onchange=()=>refresh();
    });
    if(E("fAromas")){
      const el=E("fAromas");
      el.oninput=()=>{dryMistAromas=Math.min(5,Math.max(2,+el.value||2));flash("drymist");touch()};
      el.onchange=()=>{el.value=dryMistAromas;refresh()};
    }
    m.querySelectorAll("[data-dmp]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.dmp;
      dryMistPays.has(id)?dryMistPays.delete(id):dryMistPays.add(id);
      flash("drymist");refresh();
    });
  }

  if(n===9){
    if(E("fVacQty")){
      const el=E("fVacQty");
      el.oninput=()=>{vacQty=Math.max(0,+el.value||0);flash("vacfunc","vacmodel");touch()};
      el.onchange=()=>refresh();
    }
    if(E("fVacModel"))E("fVacModel").onchange=()=>{vacModelId=E("fVacModel").value;flash("vacmodel");refresh()};
  }

  if(n===10){
    if(E("fVs1Qty")){
      const el=E("fVs1Qty");
      el.oninput=()=>{vacSt1Qty=Math.max(1,+el.value||1);flash("vacst1");touch()};
      el.onchange=()=>refresh();
    }
    if(E("fVs2Qty")){
      const el=E("fVs2Qty");
      el.oninput=()=>{vacSt2Qty=Math.max(1,+el.value||1);flash("vacst2");touch()};
      el.onchange=()=>refresh();
    }
    if(E("fVs2Model"))E("fVs2Model").onchange=()=>{vacSt2ModelId=E("fVs2Model").value;flash("vacst2");refresh()};
    m.querySelectorAll("[data-vs1]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.vs1;
      vacSt1Addons.has(id)?vacSt1Addons.delete(id):vacSt1Addons.add(id);
      flash("vacst1_"+id);refresh();
    });
    m.querySelectorAll("[data-vs2]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.vs2;
      vacSt2Addons.has(id)?vacSt2Addons.delete(id):vacSt2Addons.add(id);
      flash("vacst2_"+id);refresh();
    });
  }

  if(n===12){
    if(E("fNotes")){
      const el=E("fNotes");
      el.oninput=()=>{notes=el.value;touch()};
      el.onchange=()=>renderRail();
    }
    m.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{previewPage=+b.dataset.pv;renderMain()});
    fitPreview();
  }
}

function fitPreview(){

}

const SPEC_HEAD=`<div class="spec-h"><div>Позиция</div><div class="spec-q">Кол-во</div><div class="spec-p">Цена, ₽</div><div class="spec-s">Сумма, ₽</div></div>`;

/* Разбивка на страницы: стр. 1 — шапка, реквизиты, «О компании» и начало
   спецификации; последняя — хвост спецификации, итоги, сроки и условия;
   между ними, если позиций много, добавляются страницы только со спецификацией. */
const ROWS_TAIL=0,ROWS_MID=10;
function docPages(){
  const d=buildItems(),rows=d.items;
  const first=rows.slice(0,ROWS_P1);
  let rest=rows.slice(ROWS_P1),mid=[];
  if(rest.length>ROWS_TAIL){
    const overflow=rest.slice(0,rest.length-ROWS_TAIL);
    rest=rest.slice(rest.length-ROWS_TAIL);
    for(let i=0;i<overflow.length;i+=ROWS_MID)mid.push(overflow.slice(i,i+ROWS_MID));
  }
  const total=2+mid.length;
  const pages=[];
  let offset=ROWS_P1;
  pages.push(pageFirst(first,1,total,rows.length===0));
  mid.forEach(chunk=>{pages.push(pageMid(chunk,offset,pages.length+1,total));offset+=chunk.length});
  pages.push(pageLast(rest,offset,total,total,d));
  return pages;
}
function docHead(){

  return `<div class="doc">${docHead()}
    <div class="doc-req">
      <div><div class="l">Клиент</div><div class="v">${esc(client||"—")}</div></div>
      <div><div class="l">Контактное лицо</div><div class="v">${esc(contact||"—")}</div></div>
      <div><div class="l">Количество постов</div><div class="v">${P()}</div></div>
      <div><div class="l">Комплектация</div><div class="v">${esc(pkg?pkg.name:"—")}${bum?" · "+esc(bum.name):""}</div></div>
    </div>
    <div class="doc-sec">О компании</div>
    <div class="doc-p">${esc(COMPANY.about)}</div>
    <div class="doc-stats">${COMPANY.stats.map(([v,l])=>`<div><div class="n">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
    ${specSection}
    ${docFoot(n,total)}</div>`;
}
function pageMid(rows,offset,n,total){
  return `<div class="doc">${runHead()}
    <div class="doc-sec">Спецификация оборудования · продолжение</div>
    <div class="spec">${SPEC_HEAD}${rows.map((i,x)=>specRow(i,x+offset)).join("")}</div>
    ${docFoot(n,total)}</div>`;
}
function pageLast(rows,offset,n,total,d){
  return `<div class="doc">${runHead()}
    ${rows.length?`<div class="doc-sec">Спецификация оборудования · продолжение</div>
      <div class="spec">${SPEC_HEAD}${rows.map((i,x)=>specRow(i,x+offset)).join("")}</div>`:""}
    <div class="doc-tot">
      <div class="r"><div>Оборудование</div><div>${money(d.equipment)}</div></div>
      <div class="r"><div>Монтаж 10%</div><div>${montageOn?money(d.montage):"не включён"}</div></div>
      <div class="r"><div>Доставка</div><div>по расчёту</div></div>
      <div class="grand"><div class="l">Итого по коммерческому предложению</div><div class="v">${money(d.total)}</div></div>
    </div>
    <div class="doc-cols">
      <div><div class="doc-sec" style="margin-top:0">Сроки поставки и монтажа</div>
        ${TERMS.map(([t,x])=>`<div class="term"><div class="t">${esc(t)}</div><div>${esc(x)}</div></div>`).join("")}</div>
      <div><div class="doc-sec" style="margin-top:0">Контакты</div>
        <div class="mgr"><div class="l">Ваш менеджер</div><div class="n">${esc(COMPANY.manager)}</div>
          <div class="c">${COMPANY.phone}<br>${COMPANY.mail}</div>
          <div class="l" style="margin-top:12px">Адрес</div>
          <div style="font-size:13px;margin-top:4px">${esc(COMPANY.addr)}</div></div></div>
    </div>
    <div class="doc-sec">Условия</div>
    <div class="doc-notes">${esc(notes.trim()||DEFAULT_NOTES)}</div>
    ${docFoot(n,total)}</div>`;
}
function docPage(p){
  const pages=docPages();
  return pages[Math.min(pages.length,Math.max(1,p))-1];
}
function docPageCount(){return docPages().length}
function docHtml(){return docPages().join("")}

/* ==========================================================================
   Экспорт
   ========================================================================== */
function clientName(){return (client||"Клиент").replace(/[^\wа-яА-ЯёЁ\- ]/g,"").trim()||"Клиент"}
function docCss(){
  const st=document.querySelector("style");
  return st?st.textContent:"";
}
function standalone(extra){
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КП ${esc(clientName())}</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>${docCss()}</style>
<style>body{background:#e9edf2;padding:20px 0}.doc{margin:0 auto}
@page{size:A4;margin:10mm}
@media print{body{background:#fff;padding:0}.doc{box-shadow:none;margin:0;width:auto;min-height:0;padding:20px 24px 16px;page-break-after:always}.doc:last-child{page-break-after:auto}}
${extra||""}</style></head><body>`;
}
function exportPdf(){
  const html=standalone("")+docHtml()+`</body></html>`;
  let ifr=document.getElementById("__pdfFrame");
  if(!ifr){
    ifr=document.createElement("iframe");
    ifr.id="__pdfFrame";
    ifr.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0";
    document.body.appendChild(ifr);
  }
  const doc=ifr.contentDocument||ifr.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  setTimeout(()=>{
    try{ifr.contentWindow.focus();ifr.contentWindow.print()}
    catch(e){alert("Не удалось открыть печать. Попробуйте скачать Word и распечатать оттуда.")}
  },350);
}
async function exportWord(){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><style>${docCss()}
body{font-family:Arial,Helvetica,sans-serif}.doc{width:auto;box-shadow:none;padding:0;min-height:0}
</style></head><body>${docHtml()}</body></html>`;
  try{
    const blob=new Blob(["﻿",html],{type:"application/msword"});
    const ok=await __offerFile(`КП ${clientName()}.doc`,blob);
    if(!ok)alert("Скачивание не поддерживается в этом браузере.");
  }catch(e){alert("Скачивание не поддерживается в этом браузере.")}
}
function exportExcel(){
  if(typeof XLSX==="undefined"){alert("Библиотека Excel не загрузилась. Проверьте интернет-соединение и попробуйте снова.");return}
  const d=buildItems();
  const strip=s=>String(s||"").replace(/<br\s*\/?>/gi," · ").replace(/<[^>]+>/g,"").trim();
  const aoa=[["Позиция","Описание","Кол-во","Цена","Сумма"]];
  d.items.forEach(i=>aoa.push([i.name,strip(i.desc),i.qty??"",i.info?"в базе":(i.price||""),i.info?"":i.sum]));
  const lastItem=aoa.length;
  aoa.push([]);
  aoa.push(["","","","Оборудование",null]);
  aoa.push(["","","","Монтаж 10%",montageOn?null:0]);
  aoa.push(["","","","ИТОГО",null]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let r=2;r<=lastItem;r++){
    const q=aoa[r-1][2],p=aoa[r-1][3];
    if(typeof q==="number"&&typeof p==="number")ws[`E${r}`]={t:"n",f:`C${r}*D${r}`};
  }
  const eq=lastItem+2,mo=lastItem+3,tt=lastItem+4;
  ws[`E${eq}`]={t:"n",f:`SUM(E2:E${lastItem})`};
  if(montageOn)ws[`E${mo}`]={t:"n",f:`E${eq}*0.1`};
  ws[`E${tt}`]={t:"n",f:`E${eq}+E${mo}`};
  ws["!cols"]=[{wch:34},{wch:52},{wch:9},{wch:13},{wch:15}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"КП");
  const wbout=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const blob=new Blob([wbout],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  __offerFile(`КП ${clientName()}.xlsx`,blob).then(ok=>{if(!ok)alert("Скачивание не поддерживается в этом браузере.")});
}
function copyLink(){
  const url=location.href.split("#")[0];
  const done=()=>{
    const b=E("btnLink");if(!b)return;
    const t=b.textContent;b.textContent="Ссылка скопирована";
    setTimeout(()=>{if(E("btnLink"))E("btnLink").textContent=t},1800);
  };
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Ссылка на конструктор:",url));
  else prompt("Ссылка на конструктор:",url);
}

/* ==========================================================================
   Черновик
   ========================================================================== */
const DRAFT_KEY="dkr_kp_draft_v1";
let saveTimer=null;
function draftState(){
  return {project,client,contact,posts,notes,
    pkg:pkg?.id||null,bum:bum?.id||null,
    payments:[...payments],selectedFuncs:[...selectedFuncs],chemType,winter,degreaserType,
    chemTypes:[...chemTypesSelected],
    osmosSysOn,osmosSysId,softenerOn,softenerPrice,
    selectedExtra:[...selectedExtra],extraQty,manualQty,
    dryMistOn,dryMistAromas,dryMistPays:[...dryMistPays],cloudCashOn,
    vacOn,vacQty,vacModelId,vacSt1On,vacSt1Qty,vacSt1Addons:[...vacSt1Addons],
    vacSt2On,vacSt2Qty,vacSt2ModelId,vacSt2Addons:[...vacSt2Addons],
    montageOn,accQty,currentStep,perPostMode,visited:[...visited],
    perPost:Object.fromEntries(Object.entries(perPost).map(([k,v])=>[k,[...v]])),
    ts:Date.now()};
}
function saveDraft(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draftState()));
      E("tbSub").textContent=`${KP_NO} · черновик сохранён`;
    }catch(e){E("tbSub").textContent=`${KP_NO} · черновик не сохраняется`}
  },400);
}
function loadDraft(){
  let s;
  try{s=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null")}catch(e){return false}
  if(!s||typeof s!=="object")return false;
  const S=(v,d)=>v==null?d:v;
  project=S(s.project,"");client=S(s.client,"");contact=S(s.contact,"");
  posts=Math.max(1,+S(s.posts,6)||6);notes=S(s.notes,"");
  pkg=packages.find(p=>p.id===s.pkg)||null;
  bum=bums.find(b=>b.id===s.bum)||null;
  payments=new Set(s.payments||[]);selectedFuncs=new Set(s.selectedFuncs||[]);
  chemType=S(s.chemType,"");winter=S(s.winter,"1");degreaserType=S(s.degreaserType,"");
  chemTypesSelected=new Set(s.chemTypes||[]);
  osmosSysOn=!!s.osmosSysOn;osmosSysId=S(s.osmosSysId,"");
  softenerOn=!!s.softenerOn;softenerPrice=+S(s.softenerPrice,0)||0;
  selectedExtra=new Set(s.selectedExtra||[]);extraQty=S(s.extraQty,{})||{};
  manualQty=Object.assign({qtySink:0,qtyTable12:0,qtyTable20:0,qtyTank:0},s.manualQty||{});
  dryMistOn=!!s.dryMistOn;dryMistAromas=Math.min(5,Math.max(2,+S(s.dryMistAromas,2)||2));
  dryMistPays=new Set(s.dryMistPays||["cash","card","qr","client"]);cloudCashOn=!!s.cloudCashOn;
  vacOn=!!s.vacOn;vacQty=s.vacQty==null?null:+s.vacQty;vacModelId=S(s.vacModelId,"");
  vacSt1On=!!s.vacSt1On;vacSt1Qty=Math.max(1,+S(s.vacSt1Qty,1)||1);vacSt1Addons=new Set(s.vacSt1Addons||[]);
  vacSt2On=!!s.vacSt2On;vacSt2Qty=Math.max(1,+S(s.vacSt2Qty,1)||1);vacSt2ModelId=S(s.vacSt2ModelId,"");
  vacSt2Addons=new Set(s.vacSt2Addons||[]);
  montageOn=!!s.montageOn;
  accQty=Object.assign({consoles:null,holders:null,gunholders:null,foamguns:null,waterguns:null},s.accQty||{});
  perPostMode=!!s.perPostMode;
  perPost={};
  Object.entries(s.perPost||{}).forEach(([k,v])=>perPost[k]=new Set(v));
  currentStep=Math.min(LAST,Math.max(1,+S(s.currentStep,1)||1));
  visited=new Set((s.visited||[1]).map(Number));
  visited.add(currentStep);
  return true;
}
function clearDraft(){
  if(!confirm("Очистить черновик и начать новое КП?"))return;
  project="";client="";contact="";posts=6;notes="";
  pkg=null;bum=null;payments.clear();selectedFuncs.clear();
  chemType="";winter="1";degreaserType="";chemTypesSelected.clear();
  osmosSysOn=false;osmosSysId="";softenerOn=false;softenerPrice=0;
  selectedExtra.clear();extraQty={};manualQty={qtySink:0,qtyTable12:0,qtyTable20:0,qtyTank:0};
  dryMistOn=false;dryMistAromas=2;dryMistPays=new Set(["cash","card","qr","client"]);cloudCashOn=false;
  vacOn=false;vacQty=null;vacModelId="";
  vacSt1On=false;vacSt1Qty=1;vacSt1Addons.clear();
  vacSt2On=false;vacSt2Qty=1;vacSt2ModelId="";vacSt2Addons.clear();
  montageOn=false;accQty={consoles:null,holders:null,gunholders:null,foamguns:null,waterguns:null};
  perPostMode=false;perPost={};currentStep=1;visited=new Set([1]);
  try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
  renderAll();
}

/* ==========================================================================
   Запуск
   ========================================================================== */
const SITE_PASSWORD="dkr2026";
function unlockSite(){
  E("lockScreen").classList.add("hidden");
  E("app").classList.remove("hidden");
  loadDraft();
  renderAll();
}
function tryUnlock(){
  if(E("lockPass").value===SITE_PASSWORD){
    try{sessionStorage.setItem("dkr_unlocked","1")}catch(e){}
    unlockSite();
  }else{E("lockError").style.display="block"}
}
E("lockLogo").src=LOGO;
E("tbLogo").src=LOGO;
E("lockBtn").onclick=tryUnlock;
E("lockPass").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});

E("mbarBack").onclick=()=>goStep(currentStep-1);
E("mbarNext").onclick=()=>goStep(currentStep+1);
E("mbarTop").onclick=()=>E("sheetBg").style.display="block";
E("sheetClose").onclick=()=>E("sheetBg").style.display="none";
E("sheetBg").onclick=e=>{if(e.target===E("sheetBg"))E("sheetBg").style.display="none"};

document.addEventListener("keydown",e=>{
  if(E("app").classList.contains("hidden"))return;
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();goStep(currentStep+1)}
  else if(e.key==="Escape"&&E("sheetBg").style.display==="block")E("sheetBg").style.display="none";
});
window.addEventListener("resize",()=>{if(currentStep===LAST)fitPreview();syncMbarPad()});
window.addEventListener("orientationchange",syncMbarPad);

try{if(sessionStorage.getItem("dkr_unlocked")==="1")unlockSite()}catch(e){}
</script>
